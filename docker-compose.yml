services:
  app:
    build: .
    ports:
      - "3003:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      # Chore cycles roll over at local midnight.
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ghztracker
      POSTGRES_PASSWORD: ghztracker
      POSTGRES_DB: ghztracker
    ports:
      - "5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghztracker"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
